[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-autopilot"
version = "0.1.0"
description = "Human-in-the-loop automation for your own LinkedIn account: scheduled posts via the official API, plus reviewed likes and comments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "thakkarbhai36-dev" }]
keywords = ["linkedin", "automation", "claude", "anthropic", "scheduling"]

dependencies = [
  "anthropic>=1.6.0",
  "httpx2>=0.1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "APScheduler>=3.10",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
autopilot = "linkedin_autopilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_autopilot"]

# Ship the example files inside the package so `autopilot init` works from an
# installed wheel, not only from a clone of the repository.
[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "linkedin_autopilot/examples/config.example.yaml"
".env.example" = "linkedin_autopilot/examples/env.example"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["linkedin_autopilot"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
